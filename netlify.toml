# Netlify Configuration — Calendário Eleitoral 2026

[build]
  publish = "dist"
  command = "npm run build"

# ── Redirect: SPA fallback ─────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── www → apex ────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://www.calendarioeleitoral.app.br/*"
  to   = "https://calendarioeleitoral.app.br/:splat"
  status = 301
  force  = true

# ── Domínio antigo Netlify → domínio personalizado ────────────────────────
[[redirects]]
  from = "https://calendario-eleitoral-2026.netlify.app/*"
  to   = "https://calendarioeleitoral.app.br/:splat"
  status = 301
  force  = true

# ── Security Headers (7D.1) ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Impede que o site seja embutido em iframes (clickjacking)
    X-Frame-Options = "DENY"

    # Impede MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Controla o cabeçalho Referer enviado nas requisições
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desabilita acesso a câmera, microfone e geolocalização
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # Content Security Policy
    # - default-src 'self': apenas recursos do próprio domínio
    # - style-src + fonts: permite Google Fonts
    # - img-src: permite data URIs (ícones SVG inline) e próprio domínio
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self'"

    # HSTS: força HTTPS por 1 ano, inclui subdomínios
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # XSS Protection (legado, mas ainda útil para browsers antigos)
    X-XSS-Protection = "1; mode=block"

    # Impede que Flash/PDF carreguem conteúdo cross-domain
    X-Permitted-Cross-Domain-Policies = "none"

# ── Cache para assets estáticos com hash ────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Cache para arquivos públicos ─────────────────────────────────────────
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"